<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach — IdeaPulse</title>
{{FONTS}}
<style>
{{THEME_CSS}}
.add{max-width:66ch;margin:26px 0 0;border:1px solid var(--rule);border-radius:8px;padding:0 18px}
.add summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:15px}
.add[open] summary{border-bottom:1px solid var(--rule);margin-bottom:16px}
.add form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding-bottom:18px}
.add .field{display:flex;flex-direction:column;gap:5px}
.add .wide{grid-column:1/-1}
.add button{justify-self:start}
.list{margin-top:34px}

.prospect{max-width:66ch;padding:0 0 28px;margin-bottom:28px;border-bottom:1px solid var(--rule)}
.prospect:last-child{border-bottom:0}
.prospect h2{font:500 23px/1.3 var(--serif)}
.prospect.st-dead h2{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.biz{color:var(--muted);font-size:15px;margin-top:2px}
.due{color:var(--flag);font-weight:700;font-size:14.5px;margin-top:8px}
.when{color:var(--muted);font-size:14px;margin-top:8px}
.notes{font-size:15px;margin-top:8px}

.stages{list-style:none;display:flex;flex-wrap:wrap;margin:16px 0 0;font-size:13.5px}
.stages li{display:flex;align-items:center}
.stages li+li::before{content:"";width:18px;height:1px;background:var(--rule);margin:0 6px}
.stages li.past+li::before,.stages li.past+li.now::before{background:var(--muted)}
.stages a{color:var(--faint);text-decoration:none;padding:4px 0}
.stages li.past a{color:var(--muted)}
.stages a[aria-current]{color:var(--ground);background:var(--mark);font-weight:700;padding:4px 10px;border-radius:12px}
.stages a:hover{color:var(--ink)}
.stages a[aria-current]:hover{color:var(--ground)}
.st-won .stages a[aria-current]{background:var(--ink)}
.deadlink{display:inline-block;font-size:13px;color:var(--faint);margin-top:8px}
.deadlink[aria-current]{color:var(--flag)}

.prospect details{margin-top:14px}
.prospect summary{cursor:pointer;color:var(--muted);font-size:14px}
.prospect summary:hover{color:var(--ink)}
.omsg{white-space:pre-wrap;font:15px/1.6 var(--sans);background:var(--surface);border-radius:6px;padding:12px 14px;margin-top:8px}
.oacts{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.oacts .btn{padding:10px 16px}
.copy{font:14px/1.6 var(--sans);color:var(--muted);background:none;border:0;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.copy:hover{color:var(--ink)}
.nophone{color:var(--faint);font-size:14px}

@media (max-width:860px){
  .add form{grid-template-columns:1fr}
}
</style></head>
<body>
{{HEADER}}
<p class="lede solo">{{LEDE}}</p>
<p class="how">Each person moves from New to Won. Open the message in WhatsApp with one tap, send it, then move them to Contacted.</p>
<details class="add"{{FORM_OPEN}}>
  <summary>Add a prospect</summary>
  <form action="/outreach/add" method="post">
    <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" placeholder="Dr. Ashok" required></div>
    <div class="field"><label for="f-biz">Business</label><input id="f-biz" name="business" placeholder="Maurya Dental"></div>
    <div class="field"><label for="f-phone">WhatsApp number</label><input id="f-phone" name="phone" placeholder="9198xxxxxxxx" inputmode="tel"></div>
    <div class="field"><label for="f-tpl">Message</label>
      <select id="f-tpl" name="template"><option value="hinglish_dental">Hinglish clinic message</option><option value="english_dental">English clinic message</option><option value="followup">Follow-up</option><option value="idea_pitch">Idea pitch</option><option value="pain_reply">Reddit pain reply / DM</option></select></div>
    <div class="field"><label for="f-fu">Follow up on</label><input id="f-fu" name="followup" type="date"></div>
    <div class="field wide"><label for="f-notes">Notes</label><input id="f-notes" name="notes" placeholder="Area, where you found them"></div>
    <button type="submit" class="btn">Add prospect</button>
  </form>
</details>
<nav class="tabs" aria-label="Filter by stage">{{TABS}}</nav>
<main class="list">{{CARDS}}</main>
<script>
async function copyMsg(el){
  const msg = el.dataset.msg || '';
  try { await navigator.clipboard.writeText(msg); }
  catch (e) { prompt('Copy this message:', msg); return; }
  const old = el.textContent;
  el.textContent = 'Copied';
  setTimeout(() => { el.textContent = old; }, 1200);
}
if (window.__PREFILL__) {
  const p = window.__PREFILL__;
  const sel = document.querySelector('select[name=template]');
  if (sel && p.template) sel.value = p.template;
  const name = document.querySelector('input[name=name]');
  if (name && p.name) name.value = p.name;
  const notes = document.querySelector('input[name=notes]');
  if (notes && p.notes) notes.value = p.notes;
  const biz = document.querySelector('input[name=business]');
  if (biz) biz.value = p.business || p.idea || '';
}
</script>
</body></html>
