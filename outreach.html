<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach — IdeaPulse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b141a;color:#e9edef;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:28px;max-width:900px;margin:0 auto}
h1{font-size:24px;font-weight:800;display:inline}
.navout{color:#4ade80;font-size:14px;text-decoration:none;margin-left:14px}
.sub{color:#667781;font-size:13px;margin:6px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{color:#8fa3ad;text-decoration:none;font-size:12.5px;padding:6px 14px;border-radius:16px;border:1px solid #1d2a33;background:#111b21}
.chip:hover{border-color:#00a884;color:#e9edef}
.chip.on{background:#008069;color:#fff;border-color:#008069;font-weight:600}
.addbox{background:#111b21;border:1px solid #1d2a33;border-radius:12px;padding:16px;margin:14px 0}
.addbox input,.addbox select{background:#0b141a;color:#e9edef;border:1px solid #1d2a33;border-radius:8px;padding:9px 12px;font-size:13.5px;margin:3px 6px 3px 0;width:170px}
.addbox button{background:#008069;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer}
.ocard{background:#111b21;border:1px solid #1d2a33;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ocard.st-won{border-left:4px solid #4ade80}
.ocard.st-replied,.ocard.st-call{border-left:4px solid #fbbf24}
.ocard.st-dead{opacity:.45;border-left:4px solid #334155}
.orow{font-size:15px}
.obiz{color:#667781;font-size:13px;margin-left:8px}
.ost{font-size:10.5px;padding:2px 9px;border-radius:10px;background:#1d2a33;margin-left:8px;text-transform:uppercase;font-weight:700;color:#94a3b8}
.ost.st-won{background:#052e1b;color:#4ade80}
.ost.st-replied,.ost.st-call{background:#2e2605;color:#fbbf24}
.due{color:#f87171;font-size:11px;font-weight:700;margin-left:8px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.4}}
.om{color:#667781;font-size:12px;margin-top:4px}
details{margin-top:8px}
summary{cursor:pointer;color:#7fd4c0;font-size:12.5px}
.omsg{white-space:pre-wrap;color:#c9d1d9;background:#0b141a;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:6px;font-family:inherit}
.oacts{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.obtn{background:#008069;color:#fff;text-decoration:none;font-size:12.5px;padding:7px 14px;border-radius:8px;font-weight:600}
.obtn.wa{background:#25d366;color:#0b141a}
.obtn:hover{filter:brightness(1.1)}
.obtn.off{background:#1d2a33;color:#667781;pointer-events:none}
.ostatus{margin-left:auto;display:flex;gap:4px}
.stb{color:#667781;font-size:11px;padding:4px 8px;border-radius:6px;text-decoration:none;border:1px solid #1d2a33}
.stb.on{color:#fff;background:#008069;border-color:#008069}
</style></head>
<body>
<h1>📤 Outreach</h1> <a class="navout" href="/">← IdeaPulse</a> <a class="navout" href="/launch">🚀 Launch checklist</a>
<div class="sub">Prospect pipeline — click 📲 WhatsApp: message pre-filled, just hit send</div>
{{CHIPS}}
<div class="addbox">
  <form action="/outreach/add" method="post">
    <input name="name" placeholder="Contact name (Dr. Ashok)" required>
    <input name="business" placeholder="Business (Maurya Dental)">
    <input name="phone" placeholder="Phone (9198xxxxxxxx)">
    <select name="template"><option value="hinglish_dental">Hinglish clinic DM</option><option value="english_dental">English clinic DM</option><option value="followup">Follow-up</option><option value="idea_pitch">Idea pitch</option></select>
    <input name="followup" type="date" title="follow-up date">
    <input name="notes" placeholder="Notes (area, source…)" style="width:220px">
    <button>Add +</button>
  </form>
</div>
{{CARDS}}
<script>
if (window.__PREFILL__) {
  const p = window.__PREFILL__;
  const sel = document.querySelector('select[name=template]');
  if (sel) sel.value = p.template;
  const notes = document.querySelector('input[name=notes]');
  if (notes) notes.value = p.notes;
  const biz = document.querySelector('input[name=business]');
  if (biz) biz.value = p.idea;
}
</script>
</body></html>
